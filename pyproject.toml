[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "xian-tech-abci"
dynamic = ["version"]
description = "Python-based ABCI server for CometBFT"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Xian Core Team" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13.5,<4",
    "asyncpg>=0.31.0,<0.33",
    "loguru>=0.7.3,<0.8",
    "prometheus-client>=0.25.0,<0.26",
    "protobuf==7.35.1",
    "pynacl>=1.6.2,<2",
    "xian-tech-accounts>=0.1.3,<0.2",
    "xian-tech-contracting>=1.1.3,<2",
    "xian-tech-runtime-types>=0.1.5,<0.2",
]
keywords = ["blockchain", "cometbft", "abci", "xian", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
native = [
    "xian-tech-fastpath-core>=0.1.0,<0.2",
]
vm = [
    "xian-tech-vm-core>=0.1.2,<0.2",
]
zk = [
    "xian-tech-contracting[zk]>=1.1.3,<2",
]

[project.urls]
Repository = "https://github.com/xian-technology/xian-abci"

[project.scripts]
xian-abci = "xian.xian_abci:main"
xian-dashboard = "xian.dashboard.cli:main"
xian-configure-node = "xian.cli.configure_node:main"
xian-export-state = "xian.cli.export_state:main"
xian-state-snapshot = "xian.cli.state_snapshot:main"
xian-bds-reindex = "xian.cli.reindex_bds:main"
xian-bds-snapshot = "xian.cli.bds_snapshot:main"
xian-bds-spool = "xian.cli.bds_spool:main"
xian-parallel-estimator-report = "xian.cli.parallel_estimator_report:main"

[dependency-groups]
dev = [
    "hypothesis>=6.152.3,<7",
    "parameterized>=0.9.0,<0.10",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.12,<0.16",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "abci.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xian = [
    "dashboard/static/*.html",
    "dashboard/static/*.png",
    "tools/state_patches/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "build_proto.py",
    "src/cometbft",
    "src/gogoproto",
    "src/xian/tools",
    "tests",
    "tests/tools/fixtures",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.uv.sources]
xian-tech-accounts = { path = "../xian-contracting/packages/xian-accounts", editable = true }
xian-tech-contracting = { path = "../xian-contracting", editable = true }
xian-tech-runtime-types = { path = "../xian-contracting/packages/xian-runtime-types", editable = true }
xian-tech-fastpath-core = { path = "../xian-contracting/packages/xian-fastpath-core", editable = true }
xian-tech-vm-core = { path = "../xian-contracting/packages/xian-vm-core", editable = true }
